<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        nav {
            text-align: center;
            margin-bottom: 40px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #0366d6;
        }

        section {
            margin-bottom: 40px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my GitHub Pages website!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>

        <section id="home">
            <h2>Home</h2>
            <p>
                This is my website hosted using GitHub Pages.
            </p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>
                Add information about yourself, your project, or your organization here.
            </p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>
                Email: example@email.com
            </p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
